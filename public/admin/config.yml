backend:
  name: git-gateway
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: "hero"
    label: "Hero Section"
    files:
      - label: "Hero Content"
        name: "hero"
        file: "src/content/hero/main.md"
        fields:
          - {label: "Title", name: "title", widget: "text"}
          - {label: "Description", name: "description", widget: "text", required: false}
          - {label: "Image", name: "image", widget: "image", required: false}
          - {label: "Slug", name: "postSlug", widget: "string", required: false}
          - {label: "Tags", name: "tag", widget: "list", required: false}
          - {label: "Publish Date", name: "publishDate", widget: "datetime"}

  - name: "about"
    label: "About"
    files:
      - label: "About"
        name: "about"
        file: "src/content/about/main.md"
        fields:
          - {label: "Title", name: "title", widget: "text"}
          - {label: "Description", name: "description", widget: "text"}
          - {label: "Image", name: "image", widget: "image", required: false}
          - {label: "Tags", name: "tags", widget: "list", required: false}
          - {label: "Body", name: "body", widget: "markdown"}
          - {label: "Publish Date", name: "publishDate", widget: "datetime"}

  - name: "websites-apps"
    label: "Websites & Apps"
    files:
      - label: "Websites & Apps"
        name: "websites-apps"
        file: "src/content/websites-apps/main.md"
        fields:
          - {label: "Title", name: "title", widget: "text"}
          - {label: "Image", name: "image", widget: "image", required: false}
          - {label: "Tags", name: "tags", widget: "list", required: false}
          - {label: "Body", name: "body", widget: "markdown"}
          - {label: "Publish Date", name: "publishDate", widget: "datetime"}

  - name: "latest"
    label: "Latest"
    folder: "src/content/latest"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - {label: "Title", name: "title", widget: "text"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Image", name: "image", widget: "image", required: true}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Publish Date", name: "publishDate", widget: "datetime"}
      - {label: "Slug", name: "postSlug", widget: "string", required: false}

